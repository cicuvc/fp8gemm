[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fp8gemm-mxfp8"
version = "0.1.0"
description = "Bias-free SM120 MXFP8 training modules for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "triton>=3.2",
]

[tool.setuptools]
packages = ["mxfp8", "experiments"]
py-modules = ["fp8_adamw", "fp8_muon"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
